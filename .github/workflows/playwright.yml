name: CRM Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly run at 2 AM UTC (off-peak for CRM environment)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      work_item_id:
        description: 'Azure DevOps Work Item ID (leave empty to run all tests)'
        required: false
        type: string
      project:
        description: 'Playwright project to run'
        required: false
        default: 'crm-chromium'
        type: choice
        options:
          - crm-chromium
          - inventory-chromium
          - all

env:
  NODE_VERSION: '20'

jobs:
  # ── Job 1: TypeScript type check ────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  # ── Job 2: AI Sync (generate + push test cases to ADO) ─────────────────────
  ai-sync:
    name: AI Test Case Sync
    runs-on: ubuntu-latest
    # Only run on workflow_dispatch with a work item ID, or on schedule
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.work_item_id != '')
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync test cases from Azure DevOps
        run: |
          if [ -n "${{ github.event.inputs.work_item_id }}" ]; then
            npm run sync:azure -- --id ${{ github.event.inputs.work_item_id }}
          else
            npm run sync:azure
          fi
        env:
          DYN365_BaseURL: ${{ secrets.DYN365_BaseURL }}
          DYN365_TEST_ORG_URL: ${{ secrets.DYN365_TEST_ORG_URL }}
          DYN365_USER_NAME: ${{ secrets.DYN365_USER_NAME }}
          DYN365_PASSWORD: ${{ secrets.DYN365_PASSWORD }}
          DYN365_TEST_USER_NAME: ${{ secrets.DYN365_TEST_USER_NAME }}
          DYN365_TEST_PASSWORD: ${{ secrets.DYN365_TEST_PASSWORD }}
          AZURE_DEVOPS_ORG: ${{ secrets.AZURE_DEVOPS_ORG }}
          AZURE_DEVOPS_PROJECT: ${{ secrets.AZURE_DEVOPS_PROJECT }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}

      - name: Commit generated spec files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ai): auto-generate test specs from ADO sync [skip ci]'
          file_pattern: 'tests/**/*.spec.ts tests/**/*.manifest.json'

  # ── Job 3: Playwright Tests ──────────────────────────────────────────────────
  test:
    name: Playwright Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        project:
          - crm-chromium
          # Add inventory-chromium when ready:
          # - inventory-chromium
    container:
      image: mcr.microsoft.com/playwright:v1.45.3-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache auth state
        uses: actions/cache@v4
        with:
          path: auth-state/
          key: auth-state-${{ matrix.project }}-${{ github.run_id }}
          restore-keys: |
            auth-state-${{ matrix.project }}-

      - name: Authenticate (setup project)
        run: npx playwright test --project=setup
        env:
          DYN365_BaseURL: ${{ secrets.DYN365_BaseURL }}
          DYN365_TEST_ORG_URL: ${{ secrets.DYN365_TEST_ORG_URL }}
          DYN365_USER_NAME: ${{ secrets.DYN365_USER_NAME }}
          DYN365_PASSWORD: ${{ secrets.DYN365_PASSWORD }}
          DYN365_TEST_USER_NAME: ${{ secrets.DYN365_TEST_USER_NAME }}
          DYN365_TEST_PASSWORD: ${{ secrets.DYN365_TEST_PASSWORD }}
          INVENTORY_MGMT_URL: ${{ secrets.INVENTORY_MGMT_URL }}
          INVENTORY_MGMT_USER_NAME: ${{ secrets.INVENTORY_MGMT_USER_NAME }}
          INVENTORY_MGMT_PASSWORD: ${{ secrets.INVENTORY_MGMT_PASSWORD }}
          HEADLESS: 'true'
          CI: 'true'

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          DYN365_BaseURL: ${{ secrets.DYN365_BaseURL }}
          DYN365_TEST_ORG_URL: ${{ secrets.DYN365_TEST_ORG_URL }}
          DYN365_USER_NAME: ${{ secrets.DYN365_USER_NAME }}
          DYN365_PASSWORD: ${{ secrets.DYN365_PASSWORD }}
          DYN365_TEST_USER_NAME: ${{ secrets.DYN365_TEST_USER_NAME }}
          DYN365_TEST_PASSWORD: ${{ secrets.DYN365_TEST_PASSWORD }}
          INVENTORY_MGMT_URL: ${{ secrets.INVENTORY_MGMT_URL }}
          INVENTORY_MGMT_USER_NAME: ${{ secrets.INVENTORY_MGMT_USER_NAME }}
          INVENTORY_MGMT_PASSWORD: ${{ secrets.INVENTORY_MGMT_PASSWORD }}
          HEADLESS: 'true'
          CI: 'true'
          DEFAULT_TIMEOUT: '60000'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14

      - name: Upload test artifacts (screenshots, videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Publish test results to GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.project }})
          path: test-results/junit-results.xml
          reporter: java-junit
          fail-on-error: false

  # ── Job 4: BDD / Cucumber Tests ─────────────────────────────────────────────
  bdd:
    name: BDD Cucumber Tests
    runs-on: ubuntu-latest
    needs: typecheck
    container:
      image: mcr.microsoft.com/playwright:v1.45.3-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate (setup project)
        run: npx playwright test --project=setup
        env:
          DYN365_BaseURL: ${{ secrets.DYN365_BaseURL }}
          DYN365_TEST_ORG_URL: ${{ secrets.DYN365_TEST_ORG_URL }}
          DYN365_USER_NAME: ${{ secrets.DYN365_USER_NAME }}
          DYN365_PASSWORD: ${{ secrets.DYN365_PASSWORD }}
          DYN365_TEST_USER_NAME: ${{ secrets.DYN365_TEST_USER_NAME }}
          DYN365_TEST_PASSWORD: ${{ secrets.DYN365_TEST_PASSWORD }}
          HEADLESS: 'true'
          CI: 'true'

      - name: Run BDD tests
        run: npm run test:bdd
        env:
          DYN365_BaseURL: ${{ secrets.DYN365_BaseURL }}
          DYN365_TEST_ORG_URL: ${{ secrets.DYN365_TEST_ORG_URL }}
          DYN365_USER_NAME: ${{ secrets.DYN365_USER_NAME }}
          DYN365_PASSWORD: ${{ secrets.DYN365_PASSWORD }}
          DYN365_TEST_USER_NAME: ${{ secrets.DYN365_TEST_USER_NAME }}
          DYN365_TEST_PASSWORD: ${{ secrets.DYN365_TEST_PASSWORD }}
          HEADLESS: 'true'
          CI: 'true'

      - name: Upload BDD results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-results
          path: bdd-results/
          retention-days: 14

  # ── Job 5: Allure Report ─────────────────────────────────────────────────────
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report/
          retention-days: 30
